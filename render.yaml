services:
  - type: web
    name: butterfly-dream-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server

    buildCommand: npm ci --include=dev && npm run build

    preDeployCommand: npm run db-deploy
    initialDeployHook: npm run db-seed
    startCommand: npm start

    healthCheckPath: /api/health

    autoDeployTrigger: checksPass

    maxShutdownDelaySeconds: 30

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: butterfly-dream-postgres
          property: connectionString

      - key: FRONTEND_URL
        sync: false

      - key: CLIENT_URL
        sync: false

      - key: ALLOWED_FRONTEND_ORIGINS
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: AUTH_SESSION_DAYS
        value: "7"

      - key: AUTH_COOKIE_NAME
        value: accessories_auth

      # Vercel and Render use different parent domains initially.
      - key: AUTH_COOKIE_SAME_SITE
        value: none

      - key: ADMIN_NAME
        value: Store Administrator

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: STORE_NAME
        value: Butterfly Dream Accessories Store

      - key: DEFAULT_DELIVERY_FEE
        value: "0.00"

      - key: OTP_HASH_SECRET
        generateValue: true

      - key: ADMIN_LOGIN_OTP_MINUTES
        value: "3"

      - key: ADMIN_LOGIN_OTP_MAX_ATTEMPTS
        value: "5"

      - key: EMAIL_VERIFICATION_OTP_MINUTES
        value: "3"

      - key: EMAIL_VERIFICATION_OTP_MAX_ATTEMPTS
        value: "5"

      - key: PASSWORD_RESET_OTP_MINUTES
        value: "5"

      - key: PASSWORD_RESET_OTP_MAX_ATTEMPTS
        value: "5"

      - key: SMTP_HOST
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_SECURE
        value: "false"

      - key: SMTP_USER
        sync: false

      - key: SENDER_EMAIL
        sync: false

      - key: EMAIL_PASSWORD
        sync: false

      - key: TRUST_PROXY
        value: "1"

      - key: REQUEST_BODY_LIMIT
        value: 250kb

      - key: API_RATE_LIMIT_WINDOW_MINUTES
        value: "15"

      - key: API_RATE_LIMIT_MAX_REQUESTS
        value: "500"

      - key: AUTH_RATE_LIMIT_WINDOW_MINUTES
        value: "15"

      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "30"

      - key: CHECKOUT_RATE_LIMIT_WINDOW_MINUTES
        value: "10"

      - key: CHECKOUT_RATE_LIMIT_MAX_REQUESTS
        value: "20"

      - key: ADMIN_RATE_LIMIT_WINDOW_MINUTES
        value: "15"

      - key: ADMIN_RATE_LIMIT_MAX_REQUESTS
        value: "300"

databases:
  - name: butterfly-dream-postgres
    plan: basic-256mb
    region: frankfurt

    postgresMajorVersion: "16"

    databaseName: butterfly_dream
    user: butterfly_dream_user

    connectionPool: none

    # Block public database connections.
    # The Render API uses the private connection string.
    ipAllowList: []
