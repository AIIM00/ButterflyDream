services:
  - type: web
    name: butterfly-dream-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server

    buildCommand: npm ci --include=dev && npm run build

    # Run Prisma migrations before every production deployment.
    preDeployCommand: npm run db:deploy

    startCommand: npm start

    healthCheckPath: /api/health

    autoDeployTrigger: checksPass

    maxShutdownDelaySeconds: 30

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: butterfly-dream-postgres
          property: connectionString

      # Customer-facing website used for customer email links.
      - key: CLIENT_URL
        value: https://butterflydream.cc

      # Exact browser origins permitted to call the API with cookies.
      - key: ALLOWED_FRONTEND_ORIGINS
        value: https://butterflydream.cc,https://www.butterflydream.cc,https://admin.butterflydream.cc

      # Secret configured manually in Render.
      - key: JWT_SECRET
        sync: false

      - key: AUTH_SESSION_DAYS
        value: "7"

      - key: AUTH_COOKIE_NAME
        value: accessories_auth

      # All production sites are subdomains of butterflydream.cc.
      - key: AUTH_COOKIE_SAME_SITE
        value: lax

      # One-time initial administrator bootstrap.
      - key: ADMIN_NAME
        value: Store Administrator

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PORTAL_URL
        value: https://admin.butterflydream.cc

      # Store configuration.
      - key: STORE_NAME
        value: Butterfly Dream Accessories Store

      - key: DEFAULT_DELIVERY_FEE
        value: "0.00"

      # Still required for customer verification/password reset OTP hashing.
      - key: OTP_HASH_SECRET
        sync: false

      - key: EMAIL_VERIFICATION_OTP_MINUTES
        value: "3"

      - key: EMAIL_VERIFICATION_OTP_MAX_ATTEMPTS
        value: "5"

      - key: PASSWORD_RESET_OTP_MINUTES
        value: "5"

      - key: PASSWORD_RESET_OTP_MAX_ATTEMPTS
        value: "5"

      # Existing Brevo SMTP configuration.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_SECURE
        value: "false"

      - key: SMTP_USER
        sync: false

      - key: EMAIL_PASSWORD
        sync: false

      - key: SENDER_EMAIL
        value: support@butterflydream.cc

      # Cloudflare R2.
      - key: R2_ACCOUNT_ID
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false

      - key: R2_SECRET_ACCESS_KEY
        sync: false

      - key: R2_BUCKET_NAME
        sync: false

      - key: R2_PUBLIC_BASE_URL
        sync: false

      - key: R2_PRODUCT_PREFIX
        value: products

      # Render sits behind a reverse proxy.
      - key: TRUST_PROXY
        value: "1"

      - key: REQUEST_BODY_LIMIT
        value: 250kb

      - key: API_RATE_LIMIT_WINDOW_MINUTES
        value: "15"

      - key: API_RATE_LIMIT_MAX_REQUESTS
        value: "500"

      - key: AUTH_RATE_LIMIT_WINDOW_MINUTES
        value: "15"

      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "30"

      - key: CHECKOUT_RATE_LIMIT_WINDOW_MINUTES
        value: "10"

      - key: CHECKOUT_RATE_LIMIT_MAX_REQUESTS
        value: "20"

      - key: ADMIN_RATE_LIMIT_WINDOW_MINUTES
        value: "15"

      - key: ADMIN_RATE_LIMIT_MAX_REQUESTS
        value: "300"

databases:
  - name: butterfly-dream-postgres
    plan: basic-256mb
    region: frankfurt

    postgresMajorVersion: "16"

    databaseName: butterfly_dream
    user: butterfly_dream_user

    connectionPool: none

    # No direct public database connections.
    ipAllowList: []
